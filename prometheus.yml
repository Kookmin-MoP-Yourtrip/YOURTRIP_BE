global:
  scrape_interval: 5s     # 5초 간격으로 메트릭 수집 (부하 테스트 시 촘촘한 그래프 확인)
  evaluation_interval: 5s

scrape_configs:
  # test/presigned-url-bottleneck: arm P(presign, PR #57 이전 순차 S3 presign 복원)과
  # arm C(cloudfront, 현행 HEAD)를 job 라벨로 구분한다. 두 arm은 항상 순차 실행하므로
  # (동시 실행 시 CPU 병목 실험 자체가 무의미해진다) 측정하지 않는 쪽 job은 always down으로
  # 보이는 게 정상이다 — Prometheus는 scrape 실패를 그냥 up=0으로 기록할 뿐 문제없이 동작한다.
  - job_name: 'presign'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Prometheus 를 네이티브로 띄우므로 앱과 같은 호스트다 — 도커에서 쓰던 host.docker.internal 별칭은 컨테이너 밖에 없다
      - targets: ['localhost:8080']
  - job_name: 'cloudfront'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8081']
