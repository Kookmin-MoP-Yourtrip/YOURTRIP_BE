services:
  redis:
    image: redis:7-alpine
    container_name: yourtrip-redis
    ports:
      - "6479:6379"
    # allkeys-lru: 순수 캐시 용도(원본은 항상 DB)이므로 메모리 초과 시
    # noeviction(기본값)처럼 쓰기 실패를 내지 않고 오래된 키부터 자동 축출한다.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: yourtrip-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: yourtrip-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # test/presigned-url-bottleneck: Presign CPU Bottleneck 대시보드(8패널) + Prometheus
      # 데이터소스를 자동 provisioning. 컨테이너 기동 즉시 Dashboards > Bottleneck Test 폴더에서 확인 가능.
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ── 메일 발송 측정 전용 (#221) ─────────────────────────────────────────────
  # profiles로 묶어 평소 `docker compose up -d`에는 뜨지 않는다.
  #   docker compose --profile mail-loadtest up -d mailpit toxiproxy
  # 설계: docs/tasks/mail-async/measurement-design.md 2-1절

  # 가짜 SMTP 서버. 아무 인증이나 받아 주므로 앱의 auth=true 설정을 바꾸지 않고 같은 프로토콜
  # 경로(AUTH 포함)를 탄다. STARTTLS를 광고하지 않아 JavaMail은 평문으로 진행한다.
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: yourtrip-mailpit
    profiles: ["mail-loadtest"]
    ports:
      - "8025:8025"   # 웹 UI + 받은 메일 수 조회 API
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      # 회차 하나에 최대 2,100통(분당 420 × 5분)이 들어온다. 기본 상한(500)이면 오래된 메일이 지워져
      # 받은 수를 mail.send{sent}와 맞춰 볼 수 없다.
      - MP_MAX_MESSAGES=20000

  # 앱과 Mailpit 사이의 TCP 프록시. 앱은 이 프록시(호스트 2526)로 보내고, 회차 도중에 런타임 API(8474)로
  # 지연·무응답을 넣고 뺀다 — 앱을 재기동하지 않고 "SMTP가 돌아온 뒤"를 볼 수 있다.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: yourtrip-toxiproxy
    profiles: ["mail-loadtest"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"   # 독성 조작 API (scripts/loadtest/mail-toxic.sh)
      # 호스트 쪽은 2526이다. 1024~1100대는 다른 프로그램이 잡기 쉽다(개발 PC에서 mysqld가 1026을 잡아
      # 포트 바인딩이 조용히 실패한 적이 있다). 컨테이너 안 리슨 포트(1026)는 toxiproxy.json과 맞춘다.
      - "2526:1026"   # 앱이 보내는 SMTP 포트
    volumes:
      - ./scripts/loadtest/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      - mailpit
