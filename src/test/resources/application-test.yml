# 테스트 전용 프로필. @ActiveProfiles("test")를 붙인 테스트에서만 적용된다.
#
# 이 파일이 없으면 @SpringBootTest가 spring.profiles.default에 걸려 local 프로필로 뜬다.
# local은 앱 패키지 DEBUG + SQL/바인딩 파라미터 전량 로깅이라, 테스트 출력이 SQL로 뒤덮여
# 정작 실패 원인을 찾기 어려워진다(실측: 기동만으로 DEBUG 70줄 + TRACE 24줄이 추가된다).
#
# 로깅 레벨을 application-prod.yml과 동일하게 맞춘 것은 의도적이다. 테스트 출력이 조용해질 뿐
# 아니라, 배포 환경이 실제로 남길 로그를 테스트에서 미리 보게 된다. 값이 겹친다고 prod 프로필을
# 테스트에 그대로 쓰지는 않는다 - 이 프로필은 로깅 외에 외부 API 스텁 같은 테스트 전용 설정도
# 함께 담는 자리이기 때문이다.

logging:
  level:
    # prod와 마찬가지로 root는 INFO를 유지한다. 컨텍스트 로딩 실패나 빈 등록 오류는
    # 테스트가 왜 깨졌는지 알려주는 1차 단서라 지우면 안 된다.
    root: INFO
    backend.yourtrip: INFO
    org.hibernate: WARN
    software.amazon.awssdk: WARN
    io.lettuce.core: WARN
