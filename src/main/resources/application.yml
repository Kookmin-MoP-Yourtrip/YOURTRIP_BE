spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # 기본값(60초)로 두면 Redis 지연 시 요청 스레드가 60초씩 묶여 스레드 풀이 고갈된다.
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          # max-wait 기본값은 무한대기이므로 반드시 명시한다.
          max-wait: 1000ms

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    displayRequestDuration: true
    persistAuthorization: true
  override-with-generic-response: false

kakao:
  api-key: ${KAKAO_API_KEY}
  local:
    base-url: "https://dapi.kakao.com"

server:
  forward-headers-strategy: framework
  port: 8080
  address: 0.0.0.0
  ssl:
    enabled: false
  tomcat:
    # test/presigned-url-bottleneck: MBean 등록을 켜야 TomcatMetricsBinder가
    # tomcat_threads_busy/tomcat_threads_config_max를 Micrometer에 연결한다(기본값 false라
    # 꺼져 있으면 /actuator/prometheus에 해당 지표가 아예 나타나지 않는다 — 실측으로 확인).
    # 과거 벤치마크에서 동시성 200일 때 관찰된 maxThreads(200) 경계 현상을 이번엔 지표로 직접 본다.
    mbeanregistry:
      enabled: true

s3:
  bucket: ${S3_BUCKET}
  region: ap-northeast-2
  allowed-content-types: image/png,image/jpeg,image/webp,image/jpg,video/mp4,video/quicktime,video/webm
  max-size-bytes: 10485760 # 10MB

  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}

cloudfront:
  domain: ${CLOUDFRONT_DOMAIN}
  key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
  private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH}
  distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID}
  # mycourse Signed URL 유효기간. 기존 S3 presigned URL(15분)보다 늘렸다 — 여행 사진 수준의
  # 낮은 민감도 대비, 느린 네트워크/백그라운드 전환/긴 일정 스크롤에서 15분은 이미지가
  # 깨지는 UX 문제를 일으킬 수 있어서다.
  signed-url-ttl-minutes: 60
  # mycourse 상세조회 Signed URL 병렬 서명용 스레드풀 크기. 0이면 Runtime.availableProcessors()를 사용한다.
  signing-pool-size: ${CLOUDFRONT_SIGNING_POOL_SIZE:0}
  signing:
    # 하한: permits(54) x 요청당 이미지수(10) = 540. 상한: bufferbloat 방지(최악 대기가
    # 지연예산의 2배를 넘지 않게, t3.small 기준 약 1087) — 그 사이인 640이 기본값이다.
    queue-capacity: 640
    # (풀크기 x 지연예산) / (요청당 이미지수 x 서명 1회 비용) = (2 x 100ms) / (10 x 0.368ms) ≈ 54.
    # 0.368ms는 EC2(t3.small) 위에서 BenchmarkMain(SigningBenchmarkTest와 동일 로직)으로
    # 직접 측정한 값이다(dev 머신 기반 최초 추정치 0.7ms보다 낮게 나왔다). 100000으로 두면
    # 사실상 무제한이 돼 게이트가 비활성화되고 AbortPolicy 단독 동작과 같아진다 — 재배포 없이
    # 이 값만 바꿔 A/B 측정을 할 수 있다.
    permits: ${CLOUDFRONT_SIGNING_PERMITS:54}
    # 버스트 흡수기 — 지연 예산과 동급으로 잡는다.
    acquire-timeout-ms: 100
    # 요청 하나가 만들 수 있는 서명 태스크 수의 하드 캡(fan-out 방어, DoS 방어 겸용).
    max-keys-per-request: 50
    # permit 영구 누수 방지 안전망. 정상 부하에서는 발동하면 안 된다.
    deadline-ms: 2000

gemini:
  api-key: ${GEMINI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always