spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # 기본값(60초)로 두면 Redis 지연 시 요청 스레드가 60초씩 묶여 스레드 풀이 고갈된다.
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          # max-wait 기본값은 무한대기이므로 반드시 명시한다.
          max-wait: 1000ms

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
    org.springdoc: debug
    org.springframework.web: info
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    displayRequestDuration: true
    persistAuthorization: true
  override-with-generic-response: false

kakao:
  api-key: ${KAKAO_API_KEY}
  local:
    base-url: "https://dapi.kakao.com"

server:
  forward-headers-strategy: framework
  port: 8080
  address: 0.0.0.0
  ssl:
    enabled: false

s3:
  bucket: ${S3_BUCKET}
  region: ap-northeast-2
  allowed-content-types: image/png,image/jpeg,image/webp,image/jpg,video/mp4,video/quicktime,video/webm
  max-size-bytes: 10485760 # 10MB

  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}

cloudfront:
  domain: ${CLOUDFRONT_DOMAIN}
  key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
  private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH}
  distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID}
  # mycourse Signed URL 유효기간. 기존 S3 presigned URL(15분)보다 늘렸다 — 여행 사진 수준의
  # 낮은 민감도 대비, 느린 네트워크/백그라운드 전환/긴 일정 스크롤에서 15분은 이미지가
  # 깨지는 UX 문제를 일으킬 수 있어서다.
  signed-url-ttl-minutes: 60
  # mycourse 상세조회 Signed URL 병렬 서명용 스레드풀 크기. 0이면 Runtime.availableProcessors()를 사용한다.
  signing-pool-size: ${CLOUDFRONT_SIGNING_POOL_SIZE:0}

gemini:
  api-key: ${GEMINI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always