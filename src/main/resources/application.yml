spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # 기본값(60초)로 두면 Redis 지연 시 요청 스레드가 60초씩 묶여 스레드 풀이 고갈된다.
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          # max-wait 기본값은 무한대기이므로 반드시 명시한다.
          max-wait: 1000ms

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    displayRequestDuration: true
    persistAuthorization: true
  override-with-generic-response: false

kakao:
  api-key: ${KAKAO_API_KEY}
  local:
    base-url: "https://dapi.kakao.com"

server:
  forward-headers-strategy: framework
  port: 8080
  address: 0.0.0.0
  ssl:
    enabled: false
  tomcat:
    # test/presigned-url-bottleneck: MBean 등록을 켜야 TomcatMetricsBinder가
    # tomcat_threads_busy/tomcat_threads_config_max를 Micrometer에 연결한다(기본값 false라
    # 꺼져 있으면 /actuator/prometheus에 해당 지표가 아예 나타나지 않는다 — 실측으로 확인).
    # 과거 벤치마크에서 동시성 200일 때 관찰된 maxThreads(200) 경계 현상을 이번엔 지표로 직접 본다.
    mbeanregistry:
      enabled: true

s3:
  bucket: ${S3_BUCKET}
  region: ap-northeast-2
  allowed-content-types: image/png,image/jpeg,image/webp,image/jpg,video/mp4,video/quicktime,video/webm
  max-size-bytes: 10485760 # 10MB

  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}

cloudfront:
  domain: ${CLOUDFRONT_DOMAIN}
  key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
  private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH}
  distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID}
  # mycourse Signed URL 유효기간. 기존 S3 presigned URL(15분)보다 늘렸다 — 여행 사진 수준의
  # 낮은 민감도 대비, 느린 네트워크/백그라운드 전환/긴 일정 스크롤에서 15분은 이미지가
  # 깨지는 UX 문제를 일으킬 수 있어서다.
  signed-url-ttl-minutes: 60

gemini:
  api-key: ${GEMINI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always