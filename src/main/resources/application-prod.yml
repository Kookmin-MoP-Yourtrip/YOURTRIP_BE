# 배포 전용 프로필. SPRING_PROFILES_ACTIVE=prod 일 때만 적용된다.
# 서버에 이 환경변수를 넣는 절차는 docs/guide/profile.md 참고.
#
# 이 프로필이 적용되지 않으면(= 환경변수 누락) 배포 서버가 local로 떠서 DEBUG + SQL을
# 전량 로깅하게 된다. 배포 후 기동 로그로 프로필을 반드시 확인한다.

server:
  tomcat:
    threads:
      # 배포 타겟(vCPU 2, t3.small)에 맞춘 값이다. Tomcat 기본값 200은 CPU와 무관한 범용
      # 상수라, vCPU 2개 위에서는 워커 200개가 전부 runnable로 CPU를 다투며(load average 15.8)
      # Redis 응답을 수거하는 단일 Lettuce I/O 스레드까지 굶긴다 — Redis 명령 지연이 부하에
      # 따라 15ms까지 늘고 응답 시간의 절반을 차지했다.
      #
      # 200 → 32로 줄이면 동시 처리 요청이 32개로 잘리고 나머지는 Tomcat 커넥션 큐(스레드·CPU를
      # 안 쓰는 대기)에서 기다린다. 걷어낸 것은 Redis 대기가 아니라 CPU 낭비다 — 요청 하나당
      # CPU 비용이 26% 줄었고(0.747 → 0.555 vCPU-ms), CPU를 덜 쓰면서 처리량이 올랐다.
      # VU 200 실측: TPS 2,517 → 2,921(+16%), p95 123 → 83ms(-33%), CPU 0.94 → 0.81,
      # load average 15.8 → 5.3. 32·16·8은 TPS·p95가 1.5% 이내로
      # 평탄하고 64부터 밀린다. 평탄 구간의 최댓값을 고른 이유는 Gemini 동기 호출·대용량 업로드처럼
      # 워커를 수 초 붙드는 요청의 여유분 때문이다 — 그 경로들은 부하테스트로 재지 않았다.
      # 근거·표: docs/tasks/tomcat-thread-sizing/ec2-measurement.md
      #
      # local 프로필은 기본값(200) 그대로 둔다 — 개발 머신은 코어 수가 달라 이 값이 맞지 않고,
      # 환경별로 달라지는 설정은 프로필 파일에 두는 것이 이 저장소의 원칙이다.
      max: 32

    # ALB 뒤에 서기 위한 설정 두 개다. 앱 앞단이 ALB로 바뀌면서 필요해졌다
    # (terraform/prod/alb.tf).
    #
    # ALB의 idle_timeout이 60초인데 백엔드가 그보다 먼저 연결을 끊으면, ALB가 이미 닫힌 연결을
    # 재사용하려다 요청이 실패한다 — 클라이언트에는 간헐적인 502로 보이고 재현이 어렵다.
    # 그래서 백엔드 쪽을 항상 더 길게 잡는다(65s > 60s).
    keep-alive-timeout: 65s

    # 기본값 100은 "연결 하나로 100번 요청하면 백엔드가 끊는다"는 뜻이라, 위와 같은 이유로
    # ALB보다 먼저 끊는 상황을 만든다. -1은 무제한이고, 연결 수명은 keep-alive-timeout이 정한다.
    max-keep-alive-requests: -1

management:
  endpoint:
    health:
      # /actuator/health/liveness·/readiness를 노출한다. ALB 타깃 그룹의 헬스체크가 liveness를
      # 쓰기 때문이다.
      #
      # /actuator/health를 쓰면 안 되는 이유: 그 경로는 DB·Redis가 내려가면 503을 반환하는데,
      # ASG의 health_check_type이 ELB라 503인 인스턴스를 죽이고 다시 띄우기를 반복한다.
      # RDS 순간 장애 하나가 인스턴스 교체 폭풍으로 번진다.
      #
      # 대가: DB가 죽어도 ALB가 트래픽을 계속 보내 500이 나간다. 인스턴스가 1대일 때는 어차피
      # 뺄 곳이 없으므로 수용한다. 상시 다중 인스턴스가 되면 readiness로 옮길 여지가 있다.
      probes:
        enabled: true

logging:
  level:
    # root를 WARN으로 내리지 않는다. Spring의 기동 로그(포트 바인딩, DataSource 연결,
    # 빈 등록 실패 등)까지 사라져서 "앱이 제대로 떴는가"를 journalctl로 확인할 수 없게 된다.
    # 기동 로그는 부팅 시 한 번만 나오므로 운영 중 로그량에는 영향이 없다.
    root: INFO

    # 우리 코드는 INFO 유지. DEBUG는 운영에서 쓰지 않는다 - 로그량이 폭증해 정작 중요한
    # 로그를 골라낼 수 없고, 필터링되더라도 로그 문자열 조립 비용은 실제로 발생한다.
    backend.yourtrip: INFO

    # root: INFO 상태에서 실제로 시끄러운 서드파티만 개별적으로 눌러둔다.
    org.hibernate: WARN
    software.amazon.awssdk: WARN
    io.lettuce.core: WARN
