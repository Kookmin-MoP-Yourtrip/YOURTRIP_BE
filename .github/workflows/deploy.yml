# dev 머지 시 JAR을 빌드해 S3에 올리고, 운영 ASG가 떠 있으면 instance refresh로 굴린다(#120).
#
# ci.yml과 파일을 나눈 이유는 권한 경계다. ci.yml은 "secrets도 env도 하나 없다"가 명시적
# 설계 자산이고(docs/guide/ci.md 3절), 여기에 OIDC용 id-token 권한을 넣으면 그 문장이
# 거짓이 된다. 트리거도 다르다 — CI는 PR에서도 돌아야 하고 CD는 dev push와 수동 실행에만
# 반응한다.
#
# 이 워크플로에도 secrets 참조는 하나도 없다. AWS 자격증명은 OIDC로 실행마다 발급받고,
# 역할 ARN과 버킷 이름은 비밀이 아니라 저장소 변수(vars)에 있다.

name: CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      artifact_sha:
        description: '배포할 커밋 short SHA(7자리). 롤백은 여기에 이전 SHA를 넣는다. 해당 JAR이 S3에 이미 있어야 한다.'
        required: true
        type: string

# 같은 ASG에 refresh를 두 개 겹쳐 걸 수 없다(InstanceRefreshInProgress). 취소하지 않고
# 줄을 세운다 — 진행 중인 교체를 중간에 끊으면 fleet이 어중간한 상태로 남는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # terraform/prod/asg.tf의 name_prefix + "-asg" 와 같아야 한다.
  ASG_NAME: yourtrip-prod-asg
  # terraform/prod/variables.tf의 ssm_parameter_path + "/artifact_key".
  SSM_ARTIFACT_KEY_PARAM: /yourtrip/prod/artifact_key

jobs:
  # ------------------------------------------------------------
  # 빌드 — AWS 자격증명을 쥐지 않는다
  #
  # 이 job에서 id-token: write를 열지 않는 것이 요점이다. ./gradlew build는 서드파티 Gradle
  # 플러그인과 의존성의 코드를 실행하는데, 그 프로세스가 OIDC 토큰을 얻을 수 있으면 악성
  # 의존성 하나로 운영 계정 역할이 탈취된다. 빌드와 배포를 job으로 갈라 두면 AWS를 다루는
  # 쪽은 프로젝트 빌드 코드를 아예 실행하지 않는다.
  #
  # 롤백(workflow_dispatch)은 이미 올라간 JAR을 재사용하므로 이 job을 건너뛴다.
  # ------------------------------------------------------------
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # test까지 포함한 build를 돌린다. bootJar만 만들면 "배포된 바이트가 테스트를 통과한
      # 빌드인가"가 보장되지 않는다 — CI는 같은 커밋에 대해 병렬로 돌 뿐 이 워크플로를
      # 게이트하지 않기 때문이다. 대가는 러너 시간 수 분 중복이다.
      - name: Build
        run: ./gradlew build

      # build/libs에는 bootJar 말고 plain jar도 함께 나온다(terraform/loadtest/README.md에도
      # 같은 주의가 적혀 있다). 글롭으로 잡으면 인자가 둘이 되거나 실행 불가능한 plain jar가
      # 올라가고, 그 인스턴스는 no main manifest attribute로 뜨지 못한다.
      # 이름으로 거른 뒤 구조까지 확인한다 — plain jar에는 BOOT-INF/가 없다.
      - name: Boot JAR 식별
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)
          if [ -z "$JAR" ]; then
            echo "::error::build/libs에서 boot jar를 찾지 못했다"
            ls -la build/libs || true
            exit 1
          fi
          if ! unzip -l "$JAR" | grep -q 'BOOT-INF/'; then
            echo "::error::$JAR 은 실행 가능한 boot jar가 아니다 (BOOT-INF/ 없음)"
            exit 1
          fi
          echo "boot jar: $JAR"
          cp "$JAR" app.jar

      - name: Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: app.jar
          retention-days: 7

  # ------------------------------------------------------------
  # 배포 — AWS만 다루고 프로젝트 코드는 실행하지 않는다
  # ------------------------------------------------------------
  release:
    needs: build
    # 롤백 경로에서 build는 skipped다. always()가 없으면 이 job까지 함께 skip되어 아무 일도
    # 하지 않고 초록불이 뜬다.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read

    steps:
      # instance-refresh-preferences.json을 읽어야 하므로 트리가 필요하다. 롤백일 때 이 트리는
      # dev의 현재 상태이고 배포되는 JAR은 옛 SHA인데, preferences는 앱 코드가 아니라 인프라
      # 설정이므로 그게 맞다.
      - name: Checkout
        uses: actions/checkout@v7

      # 변수가 비어 있으면 AssumeRole이 읽기 어려운 오류로 죽는다. 먼저 이유를 밝힌다.
      - name: 저장소 변수 확인
        run: |
          MISSING=""
          [ -n "${{ vars.AWS_ROLE_ARN }}" ] || MISSING="$MISSING AWS_ROLE_ARN"
          [ -n "${{ vars.ARTIFACT_BUCKET }}" ] || MISSING="$MISSING ARTIFACT_BUCKET"
          if [ -n "$MISSING" ]; then
            echo "::error::저장소 변수가 비어 있다:$MISSING (terraform/prod-permanent/README.md의 gh variable set 절차 참고)"
            exit 1
          fi

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 대상 SHA 결정
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.artifact_sha }}"
            # 사람이 손으로 넣는 값이다. 형식이 어긋나면 존재하지 않는 키를 배포하게 된다.
            if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
              echo "::error::artifact_sha 형식이 올바르지 않다: $SHA"
              exit 1
            fi
          else
            # git rev-parse --short는 저장소 규모에 따라 8자를 낼 수 있어 키 규약이 흔들린다.
            SHA="${GITHUB_SHA::7}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "key=app/$SHA.jar" >> "$GITHUB_OUTPUT"
          echo "배포 대상: app/$SHA.jar"

      - name: 빌드 산출물 내려받기
        if: github.event_name == 'push'
        uses: actions/download-artifact@v7
        with:
          name: app-jar

      - name: S3에 업로드
        if: github.event_name == 'push'
        run: aws s3 cp app.jar "s3://${{ vars.ARTIFACT_BUCKET }}/${{ steps.target.outputs.key }}"

      # 롤백은 과거에 올라간 JAR을 쓴다. 없는 키로 배포를 시작하면 인스턴스가 부팅에 실패할
      # 때까지 알 수 없으므로 먼저 확인한다.
      - name: 아티팩트 존재 확인
        if: github.event_name == 'workflow_dispatch'
        run: |
          FOUND=$(aws s3api list-objects-v2 \
            --bucket "${{ vars.ARTIFACT_BUCKET }}" \
            --prefix "${{ steps.target.outputs.key }}" \
            --query 'length(Contents)' --output text)
          if [ "$FOUND" = "None" ] || [ "$FOUND" = "0" ]; then
            echo "::error::S3에 ${{ steps.target.outputs.key }} 가 없다"
            exit 1
          fi

      # 존재하지 않는 ASG 이름을 줘도 에러가 아니라 빈 배열이 온다. Name으로 뽑으면 문자열
      # "None"이 나와 조건문이 조용히 오작동하므로 length로 받는다.
      - name: ASG 존재 확인
        id: asg
        run: |
          COUNT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'length(AutoScalingGroups)' --output text)
          if [ "$COUNT" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 운영은 온디맨드라 대부분의 기간 ASG가 없다. 그건 정상 상태이므로 초록불로 끝낸다.
      # 이때 SSM 값은 건드리지 않는다 — 다음 apply가 마지막으로 실제 배포된 SHA로 떠야 한다.
      - name: 서버가 없으면 여기까지
        if: steps.asg.outputs.exists == 'false'
        run: |
          {
            echo "### 업로드만 완료했다"
            echo ""
            echo "- 아티팩트: ${{ steps.target.outputs.key }}"
            echo "- 운영 ASG($ASG_NAME)가 없어 교체를 건너뛰었다. 온디맨드 모델에서 정상이다."
            echo "- 서버를 올린 뒤 배포하려면 docs/guide/cd.md의 재배포 절차를 따른다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 사람이 이미 refresh를 돌리고 있으면 start가 InstanceRefreshInProgress로 실패한다.
      # 원인을 읽을 수 있게 먼저 확인한다.
      - name: 진행 중인 refresh 확인
        if: steps.asg.outputs.exists == 'true'
        run: |
          ACTIVE=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "length(InstanceRefreshes[?Status=='Pending'||Status=='InProgress'])" --output text)
          if [ "$ACTIVE" != "0" ] && [ "$ACTIVE" != "None" ]; then
            echo "::error::이미 진행 중인 instance refresh가 있다. 끝난 뒤 다시 실행한다"
            exit 1
          fi

      - name: 배포 대상 키 갱신
        if: steps.asg.outputs.exists == 'true'
        id: pointer
        run: |
          PREV=$(aws ssm get-parameter --name "$SSM_ARTIFACT_KEY_PARAM" \
            --query 'Parameter.Value' --output text)
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "이전 값: $PREV"
          aws ssm put-parameter --name "$SSM_ARTIFACT_KEY_PARAM" \
            --type String --value "${{ steps.target.outputs.key }}" --overwrite

      # preferences를 인라인 JSON으로 넘기면 따옴표 이스케이프가 지저분해진다. 파일로 넘기고,
      # 그 파일을 terraform도 함께 읽는다(terraform/prod/asg.tf의 local.refresh_prefs).
      - name: Instance Refresh 시작
        if: steps.asg.outputs.exists == 'true'
        id: refresh
        run: |
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences file://deploy/prod/instance-refresh-preferences.json \
            --query 'InstanceRefreshId' --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "instance refresh: $ID"

      # 헬스체크 게이트. 새 인스턴스가 타깃 그룹에서 healthy가 되지 못하면 refresh는 Failed로
      # 멈추고, min_healthy 100 덕분에 기존 인스턴스는 살아 있다.
      #
      # AutoRollback은 켜지 않는다. 그건 이전 Launch Template 버전으로 되돌리는 기능인데 이
      # 구성에서 LT는 배포마다 바뀌지 않으므로 되돌릴 대상이 없다. 되돌아가도 새 인스턴스는
      # 여전히 SSM에서 같은(깨진) 키를 읽는다. 롤백의 유일한 수단은 SSM 값을 되돌려 다시
      # 굴리는 것이고, 그게 이 워크플로의 workflow_dispatch 경로다.
      - name: 교체 완료까지 대기
        if: steps.asg.outputs.exists == 'true'
        run: |
          DEADLINE=$(( $(date +%s) + 1500 ))
          while :; do
            read -r STATUS PCT REASON <<< "$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' \
              --output text)"
            echo "[$(date -u +%H:%M:%S)] $STATUS ${PCT}% ${REASON}"

            case "$STATUS" in
              Successful)
                break ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "::error::instance refresh $STATUS — $REASON"
                echo "롤백하려면 dev 브랜치에서 이 워크플로를 수동 실행하고 이전 SHA를 넣는다: ${{ steps.pointer.outputs.previous }}"
                exit 1 ;;
            esac

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" || true
              echo "::error::25분 안에 끝나지 않아 refresh를 취소했다"
              exit 1
            fi
            sleep 20
          done

      - name: 타깃 헬스 확인
        if: steps.asg.outputs.exists == 'true'
        run: |
          TG=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].TargetGroupARNs[0]' --output text)
          BAD=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
            --query "length(TargetHealthDescriptions[?TargetHealth.State!='healthy'])" --output text)
          if [ "$BAD" != "0" ]; then
            echo "::error::타깃 그룹에 healthy가 아닌 대상이 $BAD 개 있다"
            aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query 'TargetHealthDescriptions[].[Target.Id,TargetHealth.State,TargetHealth.Reason]' --output table
            exit 1
          fi

      - name: 요약
        if: steps.asg.outputs.exists == 'true'
        run: |
          {
            echo "### 배포 완료"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 배포한 아티팩트 | ${{ steps.target.outputs.key }} |"
            echo "| 직전 아티팩트 | ${{ steps.pointer.outputs.previous }} |"
            echo "| instance refresh | ${{ steps.refresh.outputs.id }} |"
            echo ""
            echo "되돌리려면 이 워크플로를 **dev 브랜치에서** 수동 실행하고 artifact_sha에 직전 아티팩트의 SHA를 넣는다."
          } >> "$GITHUB_STEP_SUMMARY"
