plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'
description = 'yourtrip'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // hibernate.* 메트릭(hibernate.statements 등)을 Micrometer에 바인딩하는
    // org.hibernate.stat.HibernateMetrics 클래스가 이 아티팩트에 있다 - hibernate-core에는
    // 없어서 이게 없으면 generate_statistics: true를 켜도 HibernateMetricsAutoConfiguration의
    // @ConditionalOnClass가 실패해 자동 설정 자체가 활성화되지 않는다.
    implementation 'org.hibernate.orm:hibernate-micrometer'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus' // /actuator/prometheus 활성화 (k6+Grafana 부하테스트용)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트는 H2 인메모리 DB를 쓴다(src/test/resources/application-test.yml). 그 전까지는
    // @SpringBootTest가 .env의 개발용 PostgreSQL에 그대로 붙었고, DB_DDL_AUTO=create 탓에
    // 테스트를 돌릴 때마다 개발 DB의 테이블 13개가 drop/create 됐다(실측으로 확인).
    // testRuntimeOnly라 컴파일 시점엔 보이지 않고 운영 jar에도 들어가지 않는다.
    testRuntimeOnly 'com.h2database:h2'

    // 2.40.12 이상부터 CannedSignerRequest가 EC(ECDSA P-256) 개인키를 자동 인식한다(aws/aws-sdk-java-v2 PR #6627).
    // CloudFront Signed URL 서명을 RSA-2048에서 ECDSA P-256으로 전환하려면 이 버전 이상이 필수라 업그레이드했다.
    implementation platform('software.amazon.awssdk:bom:2.51.0') // 최신 안정판으로 맞추기
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront' // CloudFrontUtilities (Signed URL 발급), CloudFrontClient (invalidation)
    implementation 'com.google.genai:google-genai:1.28.0'
}

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

compileTestJava {
    options.annotationProcessorPath = configurations.testAnnotationProcessor
}

// ci(#116): 테스트가 .env 없이 돌려면 CloudFrontService의 @PostConstruct가 기동 시점에 읽는
// 개인키가 실재해야 한다(src/test/resources/application-test.yml의 cloudfront.private-key-path
// 주석 참고). 그 키를 저장소에 커밋하지 않고 빌드할 때마다 새로 만든다 — public 저장소에 개인키
// 형태의 파일을 두면 secret scanning 경보가 뜨고, 어떤 CloudFront 키 그룹과도 연결되지 않은
// 일회용 더미인데도 리뷰어에게 오해를 준다.
//
// openssl을 부르지 않고 JDK API만 쓰는 이유는 Windows 개발 머신과 Linux CI 러너에서 똑같이
// 동작해야 하기 때문이다(개발자 PATH에 openssl이 있다고 가정할 수 없다).
def testCloudFrontKeyFile = layout.buildDirectory.file('test-keys/cloudfront-test-key.pem')

tasks.register('generateTestCloudFrontKey') {
    description = '테스트용 CloudFront 서명 개인키(ECDSA P-256, PKCS8)를 생성한다'
    group = 'verification'
    // 출력을 선언해두면 파일이 이미 있을 때 Gradle이 태스크를 건너뛴다(UP-TO-DATE).
    outputs.file(testCloudFrontKeyFile)
    doLast {
        def keyFile = testCloudFrontKeyFile.get().asFile
        keyFile.parentFile.mkdirs()

        // P-256(prime256v1). CloudFront trusted key group이 받는 두 키 타입(RSA-2048, ECDSA
        // P-256) 중 운영에서 쓰는 쪽과 같게 맞춘다.
        def generator = java.security.KeyPairGenerator.getInstance('EC')
        generator.initialize(256)

        // PrivateKey.getEncoded()는 PKCS8 DER을 준다. 반드시 PKCS8 헤더("BEGIN PRIVATE KEY")로
        // 감싼다 — SEC1("BEGIN EC PRIVATE KEY")은 AWS SDK의 PEM 파서가 인식하지 못해
        // NullPointerException을 낸다(근거와 실측: terraform/README.md).
        def der = generator.generateKeyPair().private.encoded
        def lines = java.util.Base64.getEncoder().encodeToString(der).toList().collate(64)*.join('')
        keyFile.text = (['-----BEGIN PRIVATE KEY-----'] + lines + ['-----END PRIVATE KEY-----', '']).join('\n')
    }
}

tasks.named('test') {
    dependsOn 'generateTestCloudFrontKey'

    // test/presigned-url-bottleneck: SigningBenchmarkTest(@Tag("benchmark"))는 openssl 프로세스
    // 호출과 12,000회 반복 서명을 포함해 일반 빌드에 넣기엔 느리다 — 일반 빌드/CI에서는 제외하고,
    // 아래 `benchmarkTest` 태스크(`./gradlew benchmarkTest`)로만 명시적으로 돌린다.
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// tasks/tomcat-thread-sizing(#97): 컨텍스트 스위칭 1회 비용을 측정 대상과 같은 EC2에서 재기
// 위한 독립 실행 jar. App EC2에는 headless JRE만 깔려 있어(javac 없음) 거기서 컴파일할 수 없고,
// 스레드 수마다 JVM을 새로 띄워야 해서(JIT 프로파일 오염 방지) JUnit 태스크로는 돌릴 수 없다.
// 그래서 benchmarkTest와 달리 클래스 하나만 담은 jar를 로컬에서 만들어 scp한다.
// 의존성이 전혀 없는 순수 java.base 코드라 fat jar가 필요 없다.
tasks.register('contextSwitchBenchmarkJar', Jar) {
    description = '컨텍스트 스위칭 비용 벤치마크를 독립 실행 jar로 묶는다 (tasks/tomcat-thread-sizing)'
    group = 'verification'
    dependsOn 'testClasses'
    archiveFileName = 'context-switch-benchmark.jar'
    destinationDirectory = layout.buildDirectory.dir('benchmark')
    from(sourceSets.test.output) {
        include 'backend/yourtrip/global/benchmark/ContextSwitchCostBenchmark*.class'
    }
    manifest {
        attributes 'Main-Class': 'backend.yourtrip.global.benchmark.ContextSwitchCostBenchmark'
    }
}

tasks.register('benchmarkTest', Test) {
    description = 'presign/CloudFront 서명 1회 비용 마이크로벤치마크만 실행한다 (test/presigned-url-bottleneck)'
    group = 'verification'
    dependsOn 'generateTestCloudFrontKey'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
}
