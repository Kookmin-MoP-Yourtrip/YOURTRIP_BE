plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'
description = 'yourtrip'

// ci(#116): 자바 버전을 빌드 스크립트가 직접 선언한다. 종전에는 toolchain도
// sourceCompatibility도 없어서 Gradle을 실행한 JDK가 무엇이든 그대로 컴파일됐다 —
// "Java 21"이 IntelliJ 프로젝트 설정과 배포 스크립트(Corretto 21)에만 암묵적으로 존재했고,
// 다른 버전으로 빌드해도 아무도 눈치채지 못하는 상태였다.
// CI 러너의 setup-java 지정만으로는 부족하다. 그건 러너 환경의 약속일 뿐이라 로컬·IDE에는
// 닿지 않으므로, 빌드 스크립트가 스스로 요구해야 어디서 빌드하든 같은 바이트코드가 나온다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // hibernate.* 메트릭(hibernate.statements 등)을 Micrometer에 바인딩하는
    // org.hibernate.stat.HibernateMetrics 클래스가 이 아티팩트에 있다 - hibernate-core에는
    // 없어서 이게 없으면 generate_statistics: true를 켜도 HibernateMetricsAutoConfiguration의
    // @ConditionalOnClass가 실패해 자동 설정 자체가 활성화되지 않는다.
    implementation 'org.hibernate.orm:hibernate-micrometer'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus' // /actuator/prometheus 활성화 (k6+Grafana 부하테스트용)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 외부 API(카카오/네이버/OpenAI) 스텁 서버. AI 파이프라인은 요청 하나가 외부 호출 수십 건으로
    // fan-out되는 구조라, 실제 API를 때리지 않고 부분 장애("네이버만 죽은 상황") 같은 시나리오를
    // 재현할 수단이 필요하다.
    //
    // 일반 'org.wiremock:wiremock'이 아니라 셰이딩된 standalone을 쓰는 이유: 이 레포의
    // testRuntimeClasspath에는 이미 jackson-databind(2.12.6.1/2.16.2/2.17.2 -> 2.19.2)와
    // guava(29.0/30.1.1/33.4.0-android -> 33.4.0-jre)가 여러 버전으로 경합 중이다. WireMock이
    // 자기 Jackson/Guava를 들고 들어와 이 해석에 끼어들면, 캐시 직렬화(GenericJackson2JsonRedisSerializer)
    // 처럼 Jackson 버전에 민감한 지점에서 테스트와 운영이 다르게 동작할 수 있다. standalone은
    // 의존성을 전부 셰이딩해 버전 해석에 아예 참여하지 않는다.
    // (Jetty 충돌은 이 레포에선 문제가 아니다 — 서블릿 컨테이너로 Tomcat을 쓰고 있어 Jetty가 없다.)
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'

    // 테스트는 H2 인메모리 DB를 쓴다(src/test/resources/application-test.yml). 그 전까지는
    // @SpringBootTest가 .env의 개발용 PostgreSQL에 그대로 붙었고, DB_DDL_AUTO=create 탓에
    // 테스트를 돌릴 때마다 개발 DB의 테이블 13개가 drop/create 됐다(실측으로 확인).
    // testRuntimeOnly라 컴파일 시점엔 보이지 않고 운영 jar에도 들어가지 않는다.
    testRuntimeOnly 'com.h2database:h2'

    // 2.40.12 이상부터 CannedSignerRequest가 EC(ECDSA P-256) 개인키를 자동 인식한다(aws/aws-sdk-java-v2 PR #6627).
    // CloudFront Signed URL 서명을 RSA-2048에서 ECDSA P-256으로 전환하려면 이 버전 이상이 필수라 업그레이드했다.
    implementation platform('software.amazon.awssdk:bom:2.51.0') // 최신 안정판으로 맞추기
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront' // CloudFrontUtilities (Signed URL 발급), CloudFrontClient (invalidation)
    implementation 'com.google.genai:google-genai:1.28.0'

    // AI 코스 생성 멀티 에이전트 파이프라인용 LLM 전송 계층.
    // 2.0.x가 아니라 1.1.x인 이유: Spring AI 2.0은 Spring Boot 4.0/4.1을 요구하는데 이 레포는
    // Boot 3.5.7이다. 1.1.x는 Boot 3.4/3.5를 지원하고, 이번 설계가 Spring AI에 요구하는 유일한
    // 기능(JSON 스키마를 프롬프트 텍스트가 아니라 response_format.json_schema API 필드로 전송)이
    // 1.1.x에 이미 들어 있어 기능 손해가 없다.
    // Boot 4 이전은 별도 작업으로 분리했다 (docs/tasks/ai-course-create/ROADMAP.md 참고).
    implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
}

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

compileTestJava {
    options.annotationProcessorPath = configurations.testAnnotationProcessor
}

// ci(#116): 테스트가 .env 없이 돌려면 CloudFrontService의 @PostConstruct가 기동 시점에 읽는
// 개인키가 실재해야 한다(src/test/resources/application-test.yml의 cloudfront.private-key-path
// 주석 참고). 그 키를 저장소에 커밋하지 않고 빌드할 때마다 새로 만든다 — public 저장소에 개인키
// 형태의 파일을 두면 secret scanning 경보가 뜨고, 어떤 CloudFront 키 그룹과도 연결되지 않은
// 일회용 더미인데도 리뷰어에게 오해를 준다.
//
// openssl을 부르지 않고 JDK API만 쓰는 이유는 Windows 개발 머신과 Linux CI 러너에서 똑같이
// 동작해야 하기 때문이다(개발자 PATH에 openssl이 있다고 가정할 수 없다).
def testCloudFrontKeyFile = layout.buildDirectory.file('test-keys/cloudfront-test-key.pem')

tasks.register('generateTestCloudFrontKey') {
    description = '테스트용 CloudFront 서명 개인키(ECDSA P-256, PKCS8)를 생성한다'
    group = 'verification'
    // 출력을 선언해두면 파일이 이미 있을 때 Gradle이 태스크를 건너뛴다(UP-TO-DATE).
    outputs.file(testCloudFrontKeyFile)
    doLast {
        def keyFile = testCloudFrontKeyFile.get().asFile
        keyFile.parentFile.mkdirs()

        // P-256(prime256v1). CloudFront trusted key group이 받는 두 키 타입(RSA-2048, ECDSA
        // P-256) 중 운영에서 쓰는 쪽과 같게 맞춘다.
        def generator = java.security.KeyPairGenerator.getInstance('EC')
        generator.initialize(256)

        // PrivateKey.getEncoded()는 PKCS8 DER을 준다. 반드시 PKCS8 헤더("BEGIN PRIVATE KEY")로
        // 감싼다 — SEC1("BEGIN EC PRIVATE KEY")은 AWS SDK의 PEM 파서가 인식하지 못해
        // NullPointerException을 낸다(근거와 실측: terraform/README.md).
        def der = generator.generateKeyPair().private.encoded
        def lines = java.util.Base64.getEncoder().encodeToString(der).toList().collate(64)*.join('')
        keyFile.text = (['-----BEGIN PRIVATE KEY-----'] + lines + ['-----END PRIVATE KEY-----', '']).join('\n')
    }
}

tasks.named('test') {
    dependsOn 'generateTestCloudFrontKey'

    // @Tag("benchmark")가 붙는 이유는 두 가지이고, 둘 다 일반 빌드/CI에 넣으면 안 되는 사유다.
    //   ① 느리다 — SigningBenchmarkTest는 openssl 프로세스 호출과 12,000회 반복 서명을,
    //      RouteOptimizerBenchmarkTest는 순열 수만큼의 반복 측정을 포함한다.
    //   ② 돈과 쿼터를 쓴다 — AiHallucinationBaselineTest와 SpringAiStructuredOutputVerificationTest의
    //      실 API 케이스는 OpenAI를 실제로 호출한다. CI가 매 푸시마다 돌리면 안 된다.
    // 아래 `benchmarkTest` 태스크(`./gradlew benchmarkTest`)로만 명시적으로 돌린다.
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// tasks/tomcat-thread-sizing(#97): 컨텍스트 스위칭 1회 비용을 측정 대상과 같은 EC2에서 재기
// 위한 독립 실행 jar. App EC2에는 headless JRE만 깔려 있어(javac 없음) 거기서 컴파일할 수 없고,
// 스레드 수마다 JVM을 새로 띄워야 해서(JIT 프로파일 오염 방지) JUnit 태스크로는 돌릴 수 없다.
// 그래서 benchmarkTest와 달리 클래스 하나만 담은 jar를 로컬에서 만들어 scp한다.
// 의존성이 전혀 없는 순수 java.base 코드라 fat jar가 필요 없다.
tasks.register('contextSwitchBenchmarkJar', Jar) {
    description = '컨텍스트 스위칭 비용 벤치마크를 독립 실행 jar로 묶는다 (tasks/tomcat-thread-sizing)'
    group = 'verification'
    dependsOn 'testClasses'
    archiveFileName = 'context-switch-benchmark.jar'
    destinationDirectory = layout.buildDirectory.dir('benchmark')
    from(sourceSets.test.output) {
        include 'backend/yourtrip/global/benchmark/ContextSwitchCostBenchmark*.class'
    }
    manifest {
        attributes 'Main-Class': 'backend.yourtrip.global.benchmark.ContextSwitchCostBenchmark'
    }
}

tasks.register('benchmarkTest', Test) {
    description = '@Tag("benchmark") 테스트만 실행한다 — 마이크로벤치마크와 외부 API 실호출 측정'
    group = 'verification'
    dependsOn 'generateTestCloudFrontKey'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
}
