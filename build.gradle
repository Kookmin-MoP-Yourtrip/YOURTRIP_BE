plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'
description = 'yourtrip'

// 지금까지 빌드 스크립트에 자바 버전 선언이 없어서, 실제 컴파일 타깃이 빌드하는 사람의 로컬 JDK에
// 좌우됐다(.idea/misc.xml과 EC2 배포 스크립트만 21을 가리키고 있었다). toolchain으로 고정해
// 로컬/CI/배포가 같은 버전으로 컴파일되게 한다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // hibernate.* 메트릭(hibernate.statements 등)을 Micrometer에 바인딩하는
    // org.hibernate.stat.HibernateMetrics 클래스가 이 아티팩트에 있다 - hibernate-core에는
    // 없어서 이게 없으면 generate_statistics: true를 켜도 HibernateMetricsAutoConfiguration의
    // @ConditionalOnClass가 실패해 자동 설정 자체가 활성화되지 않는다.
    implementation 'org.hibernate.orm:hibernate-micrometer'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus' // /actuator/prometheus 활성화 (k6+Grafana 부하테스트용)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 외부 API(카카오/네이버/OpenAI) 스텁 서버. AI 파이프라인은 요청 하나가 외부 호출 수십 건으로
    // fan-out되는 구조라, 실제 API를 때리지 않고 부분 장애("네이버만 죽은 상황") 같은 시나리오를
    // 재현할 수단이 필요하다.
    //
    // 일반 'org.wiremock:wiremock'이 아니라 셰이딩된 standalone을 쓰는 이유: 이 레포의
    // testRuntimeClasspath에는 이미 jackson-databind(2.12.6.1/2.16.2/2.17.2 -> 2.19.2)와
    // guava(29.0/30.1.1/33.4.0-android -> 33.4.0-jre)가 여러 버전으로 경합 중이다. WireMock이
    // 자기 Jackson/Guava를 들고 들어와 이 해석에 끼어들면, 캐시 직렬화(GenericJackson2JsonRedisSerializer)
    // 처럼 Jackson 버전에 민감한 지점에서 테스트와 운영이 다르게 동작할 수 있다. standalone은
    // 의존성을 전부 셰이딩해 버전 해석에 아예 참여하지 않는다.
    // (Jetty 충돌은 이 레포에선 문제가 아니다 — 서블릿 컨테이너로 Tomcat을 쓰고 있어 Jetty가 없다.)
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'

    // 2.40.12 이상부터 CannedSignerRequest가 EC(ECDSA P-256) 개인키를 자동 인식한다(aws/aws-sdk-java-v2 PR #6627).
    // CloudFront Signed URL 서명을 RSA-2048에서 ECDSA P-256으로 전환하려면 이 버전 이상이 필수라 업그레이드했다.
    implementation platform('software.amazon.awssdk:bom:2.51.0') // 최신 안정판으로 맞추기
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront' // CloudFrontUtilities (Signed URL 발급), CloudFrontClient (invalidation)
    implementation 'com.google.genai:google-genai:1.28.0'
}

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

compileTestJava {
    options.annotationProcessorPath = configurations.testAnnotationProcessor
}

tasks.named('test') {
    // test/presigned-url-bottleneck: SigningBenchmarkTest(@Tag("benchmark"))는 openssl 프로세스
    // 호출과 12,000회 반복 서명을 포함해 일반 빌드에 넣기엔 느리다 — 일반 빌드/CI에서는 제외하고,
    // 아래 `benchmarkTest` 태스크(`./gradlew benchmarkTest`)로만 명시적으로 돌린다.
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

tasks.register('benchmarkTest', Test) {
    description = 'presign/CloudFront 서명 1회 비용 마이크로벤치마크만 실행한다 (test/presigned-url-bottleneck)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
}
